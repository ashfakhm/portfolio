services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    init: true

  web:
    build: .
    image: ashfakh-portfolio:latest
    user: "101:101"
    ports:
      - "80:80"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,noexec,nosuid,size=32m
      - /var/run:uid=101,gid=101,noexec,nosuid,size=8m
      - /var/log/nginx:uid=101,gid=101,noexec,nosuid,size=8m
      - /tmp:uid=101,gid=101,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
